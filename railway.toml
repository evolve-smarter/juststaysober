[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Documented Railway key (config as code): https://docs.railway.com/config-as-code
# VERIFY on the first deploy that the list form runs this single command as written.
preDeployCommand = ["sh deploy/predeploy.sh"]
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
